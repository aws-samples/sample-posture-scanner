[build-system]
requires = ["setuptools==84.1.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-posture"
version = "0.6.0"
description = "Cross-platform Prowler AWS posture, Semgrep/Gitleaks/Trivy repository security, and promptfoo Bedrock GenAI red-team CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT-0"
authors = [{ name = "Amazon Web Services" }]
keywords = ["aws", "security", "posture", "prowler", "semgrep", "gitleaks", "trivy", "sast", "sca", "secrets", "sbom", "iac", "git", "cspm", "organizations", "bedrock", "genai", "llm", "red-team", "promptfoo", "agentic"]
dependencies = [
    "boto3==1.43.56",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/aws-samples/sample-posture-scanner"
Repository = "https://github.com/aws-samples/sample-posture-scanner"
"Bug Tracker" = "https://github.com/aws-samples/sample-posture-scanner/issues"

[project.scripts]
aws-posture = "aws_posture.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aws_posture = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness-focused: pyflakes plus the pycodestyle error classes that catch
# real bugs. Formatting-only rules are intentionally excluded.
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["UP045", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
