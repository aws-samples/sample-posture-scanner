AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Dedicated IAM role for aws-posture GenAI red teaming with promptfoo. It can
  read Bedrock agent, knowledge-base, and managed-prompt definitions and invoke
  models, agents, and knowledge bases. It is designed to not change any Bedrock
  resource. Deploy it only against non-production agents, aliases, and knowledge
  bases. Scope AllowedAgentAliasArns, AllowedKnowledgeBaseArns, and
  AllowedModelArns to specific target ARNs before production use, then delete
  the stack when red teaming ends.

Parameters:
  RoleName:
    Type: String
    Default: GenAIRedTeamRole
    AllowedPattern: '[\w+=,.@-]{1,64}'
  TrustedPrincipalArn:
    Type: String
    AllowedPattern: 'arn:[^:]+:iam::[0-9]{12}:(root|user/.+|role/.+)'
    Description: Exact IAM user, role, or account-root ARN allowed to assume this role.
  ExternalId:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      External ID for confused-deputy protection. Required when TrustedPrincipalArn
      belongs to a different account; strongly recommended for all deployments.
  MaxSessionDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
  AllowedAgentAliasArns:
    Type: CommaDelimitedList
    Default: '*'
    Description: >
      Agent alias ARNs that bedrock:InvokeAgent is permitted on
      (e.g. arn:aws:bedrock:us-east-1:123456789012:agent-alias/ABCDEFGHIJ/TSTALIAS).
      Defaults to all (*). Strongly recommended to scope to specific aliases
      before production use to prevent invoking production agents.
  AllowedKnowledgeBaseArns:
    Type: CommaDelimitedList
    Default: '*'
    Description: >
      Knowledge-base ARNs that bedrock:Retrieve and bedrock:RetrieveAndGenerate
      are permitted on. Defaults to all (*). Scope to specific knowledge bases
      before production use.
  AllowedModelArns:
    Type: CommaDelimitedList
    Default: '*'
    Description: >
      Bedrock model ARNs (or model IDs) that bedrock:InvokeModel* is permitted on.
      Defaults to all (*). Scope to the attacker/grader model and target models
      before production use.

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, '']]

Resources:
  GenAIRedTeamRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      Description: Invoke-only role managed by aws-posture for promptfoo red teaming.
      Tags:
        - Key: ManagedBy
          Value: aws-posture
        - Key: Purpose
          Value: genai-redteam
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustExactRedTeamPrincipal
            Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition: !If
              - HasExternalId
              - StringEquals:
                  sts:ExternalId: !Ref ExternalId
              - !Ref AWS::NoValue

  GenAIRedTeamPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: genai-redteam-invoke
      Roles:
        - !Ref GenAIRedTeamRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadTargetDefinitions
            Effect: Allow
            Resource: '*'
            Action:
              - bedrock:GetAgent
              - bedrock:GetAgentAlias
              - bedrock:GetKnowledgeBase
              - bedrock:GetPrompt
              - bedrock:ListPrompts
              - bedrock:GetInferenceProfile
          - Sid: InvokeAgents
            Effect: Allow
            Resource: !Ref AllowedAgentAliasArns
            Action:
              - bedrock:InvokeAgent
          - Sid: InvokeModels
            Effect: Allow
            Resource: !Ref AllowedModelArns
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
          - Sid: RetrieveKnowledgeBases
            Effect: Allow
            Resource: !Ref AllowedKnowledgeBaseArns
            Action:
              - bedrock:Retrieve
              - bedrock:RetrieveAndGenerate
          - Sid: DecryptCustomerManagedPromptsViaBedrock
            Effect: Allow
            Resource: '*'
            Action: kms:Decrypt
            Condition:
              StringLike:
                kms:ViaService: bedrock.*.amazonaws.com

Outputs:
  RoleArn:
    Description: Red-team role ARN.
    Value: !GetAtt GenAIRedTeamRole.Arn
